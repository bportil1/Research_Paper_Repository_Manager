<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Library Manager</title><style>
:root{--bg:#f5f6f8;--panel:#fff;--border:#d8dee8;--text:#20242a;--muted:#657080;--accent:#315f96;--danger:#8b2828;--warn:#9a6200;--ok:#1d6b3a;--blue:#245f96;--gray:#69707d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--border);padding:17px;position:sticky;top:0;height:100vh;overflow:auto}.main{min-width:0}header{background:#fff;border-bottom:1px solid var(--border);padding:17px 24px;position:sticky;top:0;z-index:20}h1{margin:0 0 8px;font-size:24px}h2{font-size:16px;margin:18px 0 8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border:1px solid #b7c0ce;border-radius:8px;padding:8px 10px;background:#fff;line-height:1.35}button{cursor:pointer}button:hover{background:#eef3f8}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}input[type=search]{min-width:330px}.content{padding:20px 24px}.summary{color:var(--muted);margin-bottom:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid var(--border);border-radius:8px;padding:8px;background:#fbfcfe}.stat b{display:block;font-size:19px}.topic-list button{width:100%;display:flex;justify-content:space-between;border:0;margin:3px 0}.topic-list .active{background:#eaf1f9}.card{background:#fff;border:1px solid var(--border);border-radius:11px;margin:12px 0;overflow:visible}.head{display:flex;gap:10px;align-items:center;background:#f0f2f6;padding:12px 14px;cursor:pointer}.head strong{flex:1}.body{display:none}.card.open .body{display:block}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}th{font-size:.84em;color:var(--muted);background:#fbfcfe}.title{font-weight:600;min-width:280px}
.title-link{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.title-link:hover{text-decoration:underline;background:none}
.icon-button{border:0;background:transparent;padding:3px 6px;font-size:13px}
.topic-statuses{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-bottom:1px solid #edf0f4;background:#fbfcfe}
.status-badge{border:1px solid #d4dae3;border-radius:999px;padding:3px 7px;font-size:12px;background:#fff;cursor:pointer}
.status-badge:hover{background:#eef3f8}
.action-trigger{min-width:34px;font-weight:bold}.small{font-size:.89em;color:var(--muted);word-break:break-word}td[contenteditable]{outline:none}td[contenteditable]:focus{box-shadow:inset 0 0 0 2px #9faec5}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid #c3cad5;border-radius:999px;padding:5px 8px;cursor:pointer;min-width:112px}.dot{width:9px;height:9px;border-radius:50%}.OK{background:var(--ok)}.NeedsReview{background:var(--warn)}.Priority{background:#b02a2a}.Read{background:var(--blue)}.Cited{background:#7046a1}.Ignore{background:var(--gray)}.menu{position:fixed;display:none;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 25px #0002;z-index:1000;overflow:hidden}.menu button{display:block;width:100%;border:0;border-radius:0;text-align:left}.row-actions{white-space:nowrap}.mini{padding:5px 7px;font-size:12px}.danger{color:var(--danger)}.modal-bg{display:none;position:fixed;inset:0;background:#0006;z-index:900;align-items:center;justify-content:center}.modal{background:#fff;border-radius:11px;padding:18px;width:min(700px,calc(100vw - 30px));max-height:85vh;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.progress{height:8px;background:#e2e7ef;border-radius:999px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.jobbox{border:1px solid var(--border);border-radius:9px;padding:12px;background:#fbfcfe;margin:12px 0}.jobline{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccd4df;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}}
</style></head><body><div class="app"><aside class="side"><h1 style="font-size:20px">Paper Manager</h1><div id="sideSummary" class="summary"></div><div id="stats" class="stats"></div><h2>Topics</h2><div id="topicList" class="topic-list"></div></aside><section class="main"><header><h1>Offline Paper Reference Manager</h1><div id="summary" class="summary"></div><div class="toolbar"><input id="search" type="search" placeholder="Search title, author, venue, DOI, notes..."><select id="statusFilter"><option value="">All statuses</option></select><button class="primary" onclick="syncPreview()">Sync</button><button onclick="save()">Save</button><button onclick="launchResearchSearch()">Research Search</button><button onclick="more(event)">More ▾</button></div></header><main class="content"><div id="notice" class="summary">Loading...</div><div id="report"></div></main></section></div><div id="statusMenu" class="menu"></div><div id="rowMenu" class="menu"></div><div id="moreMenu" class="menu"></div><div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div><input id="bibInput" type="file" accept=".bib" hidden onchange="importBib(this)"><input id="csvInput" type="file" accept=".csv,text/csv" hidden onchange="importCSV(this)"><script>
let rows=[],selectedTopic='',openTopics=new Set(),statusId=null;const statuses=['Needs Review','Priority','Read','Cited','OK','Ignore'];
const E=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const C=s=>String(s).replaceAll(' ','');
async function api(u,o={}){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function note(s){document.getElementById('notice').innerText=s}
function showJob(title){modal(`<h2>${E(title)}</h2><div class=jobbox><div class=jobline><span id=jobMessage><i class=spinner></i>Starting…</span><span id=jobCount></span></div><div class=progress><div id=jobBar style="width:2%"></div></div><p class=small style="margin-bottom:0">This operation is running locally. You may keep this window open and watch its progress.</p></div><div class=modal-actions><button id=jobClose disabled onclick=closeModal()>Close</button></div>`)}
async function watchJob(jobId,title,onDone){showJob(title);while(true){const j=await api('/api/jobs/'+jobId);const total=Number(j.total||0),current=Number(j.current||0),pct=total?Math.max(2,Math.min(100,Math.round(current/total*100))):(j.status==='done'?100:8);document.getElementById('jobMessage').innerHTML=(j.status==='running'||j.status==='queued'?'<i class=spinner></i>':'')+E(j.message||j.status);document.getElementById('jobCount').innerText=total?`${current} / ${total}`:'';document.getElementById('jobBar').style.width=pct+'%';if(j.status==='done'){document.getElementById('jobClose').disabled=false;if(onDone)await onDone(j.result||{});return j.result||{}}if(j.status==='error'){document.getElementById('jobClose').disabled=false;document.getElementById('jobMessage').innerHTML='<b style="color:var(--danger)">'+E(j.error||'Operation failed')+'</b>';const box=document.querySelector('.jobbox');if(j.error_details){box.insertAdjacentHTML('beforeend','<details style="margin-top:12px"><summary>Technical details</summary><pre style="white-space:pre-wrap;font-size:12px">'+E(j.error_details)+'</pre></details>')}note(j.error||'Operation failed');throw Error(j.error||'Operation failed')}await new Promise(r=>setTimeout(r,500))}}

function groups(list){const g={};for(const r of list)(g[r.Topic||'Uncategorized']??=[]).push(r);return g}function topics(){return Object.keys(groups(rows)).sort()}function filtered(){const q=document.getElementById('search').value.toLowerCase(),st=document.getElementById('statusFilter').value;return rows.filter(r=>(!selectedTopic||r.Topic===selectedTopic)&&(!st||r.Status===st)&&(!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q))))}
function statusCounts(list){const counts={};for(const s of statuses)counts[s]=0;for(const r of list)counts[r.Status]=(counts[r.Status]||0)+1;return counts}
function statusOptions(counts,total,label='All statuses'){return `<option value="">${label} (${total})</option>`+statuses.map(s=>`<option value="${E(s)}">${E(s)} (${counts[s]||0})</option>`).join('')}
function render(){
 const f=filtered(),g=groups(f),allGroups=groups(rows),globalCounts=statusCounts(rows),needs=globalCounts['Needs Review']||0,read=globalCounts.Read||0,cited=globalCounts.Cited||0,pct=rows.length?Math.round((rows.length-needs)/rows.length*100):0;
 document.getElementById('summary').innerText=`${rows.length} papers · ${topics().length} topics · ${needs} need review · ${f.length} visible`;
 document.getElementById('sideSummary').innerHTML=`${pct}% reviewed<div class="progress"><div style="width:${pct}%"></div></div>`;
 document.getElementById('stats').innerHTML=`<div class=stat><b>${rows.length}</b>Total</div><div class=stat><b>${needs}</b>Review</div><div class=stat><b>${read}</b>Read</div><div class=stat><b>${cited}</b>Cited</div>`;
 const sf=document.getElementById('statusFilter'),priorStatus=sf.value;sf.innerHTML=statusOptions(globalCounts,rows.length);sf.value=priorStatus;
 document.getElementById('topicList').innerHTML=`<button class="${!selectedTopic?'active':''}" onclick="selectTopic('')"><span>All Topics</span><span>${rows.length}</span></button>`+topics().map(t=>`<button class="${selectedTopic===t?'active':''}" onclick="selectTopic('${E(t).replaceAll("'","\\'")}')"><span>${E(t)}</span><span>${allGroups[t].length}</span></button>`).join('');
 const rep=document.getElementById('report');rep.innerHTML='';
 for(const t of Object.keys(g).sort()){
   const card=document.createElement('section');card.className='card'+(openTopics.has(t)?' open':'');
   const rs=g[t].sort((a,b)=>String(a.Title).localeCompare(String(b.Title)));
   const topicAll=allGroups[t]||[],counts=statusCounts(topicAll);
   const badges=statuses.filter(s=>counts[s]).map(s=>`<button class=status-badge onclick="event.stopPropagation();filterTopicStatus('${E(t).replaceAll("'","\\'")}','${E(s).replaceAll("'","\\'")}')"><i class="dot ${C(s)}" style="display:inline-block;margin-right:5px"></i>${E(s)} ${counts[s]}</button>`).join('');
   card.innerHTML=`<div class=head onclick="toggle('${E(t).replaceAll("'","\\'")}')"><strong>${E(t)}</strong><span class=small>${topicAll.length} papers</span><button class=icon-button title="Open topic folder" onclick="event.stopPropagation();openTopicFolder('${E(t).replaceAll("'","\\'")}')">📂</button></div><div class=body><div class=topic-statuses>${badges||'<span class=small>No status counts.</span>'}</div><table><thead><tr><th>Title</th><th>Authors</th><th>Year</th><th>Venue</th><th>Status</th><th>Notes</th><th>File</th><th>Actions</th></tr></thead><tbody></tbody></table></div>`;
   const tb=card.querySelector('tbody');
   for(const r of rs){
     const tr=document.createElement('tr');
     tr.innerHTML=`<td class=title><button class=title-link title="Open PDF" onclick="openPaper('${r.PaperID}')">${E(r.Title)}</button> <button class=icon-button title="Edit title" onclick="editField('${r.PaperID}','Title')">✎</button></td><td contenteditable data-id="${r.PaperID}" data-col=Authors class=small>${E(r.Authors)}</td><td contenteditable data-id="${r.PaperID}" data-col=Year>${E(r.Year)}</td><td contenteditable data-id="${r.PaperID}" data-col=Venue class=small>${E(r.Venue)}</td><td><span class=pill onclick="statusMenu(event,'${r.PaperID}')"><i class="dot ${C(r.Status)}"></i>${E(r.Status)}</span></td><td contenteditable data-id="${r.PaperID}" data-col=Notes class=small>${E(r.Notes)}</td><td class=small>${E(r.Filename)}<br>${E(r.FileState)}</td><td class=row-actions><button class="mini action-trigger" onclick="rowActions(event,'${r.PaperID}')">⋮</button></td>`;
     tb.appendChild(tr)
   }
   card.addEventListener('input',e=>{const c=e.target.closest('[data-id][data-col]');if(c){const r=rows.find(x=>x.PaperID===c.dataset.id);if(r)r[c.dataset.col]=c.innerText.trim()}});
   rep.appendChild(card)
 }
}
function selectTopic(t){selectedTopic=t;render()}
function toggle(t){openTopics.has(t)?openTopics.delete(t):openTopics.add(t);render()}
function filterTopicStatus(topic,status){selectedTopic=topic;document.getElementById('statusFilter').value=status;openTopics.add(topic);render()}
function editField(id,col){const r=rows.find(x=>x.PaperID===id);if(!r)return;const value=prompt(`Edit ${col}`,r[col]||'');if(value!==null){r[col]=value.trim();render()}}
function statusMenu(e,id){
 e.stopPropagation();statusId=id;
 const row=rows.find(r=>r.PaperID===id),topicRows=rows.filter(r=>r.Topic===row.Topic),counts=statusCounts(topicRows);
 const m=document.getElementById('statusMenu');
 m.innerHTML=statuses.map(s=>`<button onclick="chooseStatus('${s}')"><i class="dot ${C(s)}" style="display:inline-block;margin-right:7px"></i>${E(s)} (${counts[s]||0})</button>`).join('');
 const b=e.currentTarget.getBoundingClientRect();m.style.left=b.left+'px';m.style.top=b.bottom+4+'px';m.style.display='block'
}
function chooseStatus(s){const row=rows.find(r=>r.PaperID===statusId);if(row)row.Status=s;document.getElementById('statusMenu').style.display='none';render()}
async function openPaper(id){try{const d=await api('/api/papers/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:id})});note(`Opened ${d.path}`)}catch(e){alert('Unable to open PDF: '+e.message)}}
async function showInFolder(id){try{const d=await api('/api/papers/show-in-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:id})});note(`Opened folder ${d.path}`)}catch(e){alert('Unable to open folder: '+e.message)}}
async function openTopicFolder(topic){try{const d=await api('/api/topics/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic})});note(`Opened topic folder ${d.path}`)}catch(e){alert('Unable to open topic folder: '+e.message)}}
async function copyPaperPath(id){const r=rows.find(x=>x.PaperID===id);if(!r)return;try{await navigator.clipboard.writeText(r.Path||'');note('Paper path copied to clipboard.')}catch(e){prompt('Copy paper path:',r.Path||'')}}
function rowActions(e,id){
 e.stopPropagation();const r=rows.find(x=>x.PaperID===id),m=document.getElementById('rowMenu');
 m.innerHTML=`<button onclick="openPaper('${id}')">Open PDF</button><button onclick="showInFolder('${id}')">Show in Folder</button><button onclick="copyPaperPath('${id}')">Copy Path</button><button onclick="editField('${id}','Title')">Edit Title</button><button onclick="move('${id}')">Move to Topic…</button>${r.FileState==='Deleted'?`<button onclick="restore('${id}')">Restore</button>`:`<button class=danger onclick="archive('${id}')">Archive</button>`}`;
 const b=e.currentTarget.getBoundingClientRect();m.style.left=Math.max(8,b.right-190)+'px';m.style.top=b.bottom+4+'px';m.style.display='block'
}
async function load(){try{const d=await api('/api/library');rows=d.rows;note(`Loaded ${rows.length} records from ${d.library_root}`);render()}catch(e){note(e.message);config()}}async function save(){await api('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});note('Metadata saved with checkpoint.');await load()}
function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}async function config(){let c={};try{c=await api('/api/config')}catch{}modal(`<h2>Library Settings</h2><input id=root value="${E(c.library_root||'')}" placeholder="/home/user/Documents/offline_papers" style="width:100%"><div class=modal-actions><button onclick=closeModal()>Cancel</button><button class=primary onclick=saveConfig()>Save</button></div>`)}async function saveConfig(){await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({library_root:document.getElementById('root').value})});closeModal();load()}

async function launchResearchSearch(){try{const d=await api('/api/research-search/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const w=window.open(d.url,'paperResearchSearch','width=1280,height=900,resizable=yes,scrollbars=yes');if(!w)alert('Research Search was launched but the browser blocked the new window. Allow pop-ups for this local site and try again.');else note(d.already_running?'Opened the existing Research Search window.':'Started Research Search and opened its window.')}catch(e){alert('Unable to launch Research Search: '+e.message);note('Research Search launch failed: '+e.message)}}
async function syncPreview(){modal(`<h2>Synchronize Library</h2><p>The sync will scan the directory, preserve existing metadata, detect moved files when hashes are available, and extract titles only where they are missing.</p><label><input id=detectMoves type=checkbox checked> Detect externally moved or renamed PDFs</label><br><label><input id=extractTitles type=checkbox checked> Extract missing titles from PDF first pages</label><div class=modal-actions><button onclick=closeModal()>Cancel</button><button class=primary onclick=syncApply()>Start Sync</button></div>`)}
async function syncApply(){const detect_moves=document.getElementById('detectMoves').checked,extract_titles=document.getElementById('extractTitles').checked;const d=await api('/api/sync/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({detect_moves,extract_titles})});await watchJob(d.job_id,'Synchronizing Library',async result=>{note(`Sync complete: ${result.new||0} new, ${result.missing||0} missing, ${result.moved_or_renamed||0} moved/renamed.`);await load()})}
function move(id){const r=rows.find(x=>x.PaperID===id);modal(`<h2>Move Paper</h2><p>${E(r.Title)}</p><input id=dest value="${E(r.Topic)}" list=topics style="width:100%"><datalist id=topics>${topics().map(t=>`<option value="${E(t)}">`).join('')}</datalist><div class=modal-actions><button onclick=closeModal()>Cancel</button><button class=primary onclick="doMove('${id}')">Move PDF</button></div>`)}async function doMove(id){await api('/api/papers/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:id,destination_topic:document.getElementById('dest').value})});closeModal();load()}async function archive(id){if(!confirm('Archive this PDF?'))return;await api('/api/papers/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:id})});load()}async function restore(id){await api('/api/papers/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:id})});load()}
function more(e){e.stopPropagation();const m=document.getElementById('moreMenu');m.innerHTML=`<button onclick=config()>Library Settings</button><button onclick="document.getElementById('csvInput').click()">Import / Transfer CSV</button><button onclick="document.getElementById('bibInput').click()">Import BibTeX</button><button onclick=extractAll()>Extract PDF Titles & Metadata</button><button onclick=duplicates()>Duplicate Review</button><button onclick=history()>History</button><button onclick=checkpoints()>Checkpoints</button><button onclick=restoreLatestReport()>Restore Latest Report Checkpoint</button><button onclick=exportCSV()>Export Full CSV</button>`;const b=e.currentTarget.getBoundingClientRect();m.style.left=b.left+'px';m.style.top=b.bottom+4+'px';m.style.display='block'}
async function importBib(i){const f=i.files[0];if(!f)return;try{const fd=new FormData();fd.append('file',f);const r=await fetch('/api/bib/import',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);await watchJob(d.job_id,'Importing BibTeX',async result=>{note(`BibTeX imported: ${result.entries||0} entries, ${result.matched||0} matched, ${result.created||0} new references.`);await load()})}catch(e){alert('BibTeX import failed: '+e.message);note('BibTeX import failed.')}finally{i.value=''}}
async function importCSV(i){const f=i.files[0];if(!f)return;const file=f;i.value='';modal(`<h2>Transfer CSV Information</h2><p><b>${E(file.name)}</b></p><p>By default this transfers metadata only. It will not change topic folders, file paths, filenames, hashes, or file states.</p><label><input id=createUnmatched type=checkbox> Create unmatched rows in a “CSV Import Inbox” as reference-only records</label><div class=modal-actions><button onclick=closeModal()>Cancel</button><button class=primary id=csvStart>Start Transfer</button></div>`);document.getElementById('csvStart').onclick=async()=>{try{const fd=new FormData();fd.append('file',file);fd.append('create_unmatched',document.getElementById('createUnmatched').checked?'true':'false');const r=await fetch('/api/csv/import',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);await watchJob(d.job_id,'Transferring CSV Metadata',async result=>{const unknown=result.unknown_columns?.length?` Unknown columns preserved in Notes: ${result.unknown_columns.join(', ')}.`:'';note(`CSV transfer complete: ${result.matched||0} matched, ${result.unmatched||0} unmatched, ${result.created||0} inbox records, ${result.updated_fields||0} fields updated.${unknown}`);await load()})}catch(e){alert('CSV import failed: '+e.message);note('CSV import failed.')}}}
async function extractAll(){if(!confirm('Extract embedded and first-page metadata from present PDFs? Progress will be shown.'))return;const d=await api('/api/metadata/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await watchJob(d.job_id,'Extracting PDF Titles and Metadata',async result=>{note(`Metadata extraction updated ${result.updated||0} PDFs${result.errors?.length?` with ${result.errors.length} errors`:''}.`);await load()})}
async function duplicates(){const d=await api('/api/duplicates');modal(`<h2>Possible Duplicates (${d.count})</h2>${d.groups.map(g=>`<div style="border-bottom:1px solid #ddd;padding:8px"><b>${E(g[0].Title)}</b>${g.slice(1).map(x=>`<div class=small>${E(x.Title)} · ${E(x.Filename)} · similarity ${x.Similarity??''}</div>`).join('')}</div>`).join('')||'<p>No likely duplicates.</p>'}<div class=modal-actions><button onclick=closeModal()>Close</button></div>`)}async function history(){const d=await api('/api/history');modal(`<h2>History</h2>${d.history.map(x=>`<p><b>${E(x.operation)}</b><br><span class=small>${E(x.timestamp)}</span></p>`).join('')||'<p>No history.</p>'}<div class=modal-actions><button onclick=closeModal()>Close</button></div>`)}async function checkpoints(){const d=await api('/api/checkpoints');modal(`<h2>Checkpoints</h2>${d.checkpoints.map(x=>`<p><b>${E(x.operation)}</b><br><span class=small>${E(x.name)} · ${x.copied_files.length} files</span></p>`).join('')||'<p>No checkpoints.</p>'}<div class=modal-actions><button onclick=closeModal()>Close</button></div>`)}
async function restoreLatestReport(){if(!confirm('Restore paper_report.csv from the latest checkpoint? The current report will be preserved in an emergency checkpoint first.'))return;try{const d=await api('/api/checkpoints/restore-latest',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});note(`Restored ${d.rows_restored} rows from checkpoint ${d.checkpoint}.`);await load()}catch(e){alert('Restore failed: '+e.message);note('Restore failed: '+e.message)}}
function exportCSV(){const cols=['PaperID','Topic','Title','Filename','Path','Status','Notes','Year','Authors','Venue','DOI','BibKey','Abstract','Keywords','FileState','SHA256','OriginalPath','ArchivedAt','AddedDate','ModifiedDate'];const q=v=>'"'+String(v??'').replaceAll('"','""').replace(/\r?\n/g,' ')+'"';const txt=[cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='paper_report_export.csv';a.click()}
document.addEventListener('click',e=>{if(!e.target.closest('.menu')&&!e.target.closest('.pill')&&!e.target.closest('.action-trigger'))document.querySelectorAll('.menu').forEach(m=>m.style.display='none')});document.getElementById('search').addEventListener('input',render);document.getElementById('statusFilter').addEventListener('change',render);load();
</script></body></html>
