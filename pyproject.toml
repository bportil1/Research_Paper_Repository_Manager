[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-repository-manager"
version = "0.4.0"
description = "Standalone local paper repository manager with a reusable ReferenceManager API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
web = ["Flask>=3.0,<4"]
dev = ["pytest>=8", "Flask>=3.0,<4"]

[tool.setuptools.packages.find]
include = ["reference_manager*"]

[tool.setuptools.package-data]
"reference_manager.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
